name: Create Release and Upload Assets

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "introduce/**"
      - ".github/workflows/font-subset.yml"

# 定义工作流中的任务
jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          echo "ARCHS=linux-amd64 linux-arm64 linux-arm darwin-amd64 darwin-arm64" >> "$GITHUB_ENV"
          mkdir -p release_assets

      - name: Download, Package, and Prepare Assets
        shell: bash
        run: |
          set -euo pipefail

          for arch in $ARCHS; do
            if [[ "$arch" == darwin-* ]]; then
              short_arch="${arch#darwin-}"
              package_suffix="darwin-${short_arch}"
              source_asset="cloudflared-${arch}.tgz"
              package_binary="cloudflared-${arch}"
              package_dir="cf-helper-release-${package_suffix}"
              archive_file="cloudflared-${arch}.tgz"
            else
              short_arch="${arch#linux-}"
              package_suffix="$short_arch"
              source_asset="cloudflared-${arch}"
              package_binary="cloudflared-${arch}"
              package_dir="cf-helper-release-${package_suffix}"
              archive_file="$package_binary"
            fi

            echo "--- Processing architecture: ${arch} ---"
            echo "Downloading ${source_asset}..."
            curl --fail --location --show-error --retry 3 --connect-timeout 15 \
              "https://github.com/cloudflare/cloudflared/releases/latest/download/${source_asset}" \
              --output "$archive_file"

            rm -rf "$package_dir"
            mkdir -p "$package_dir"
            cp cf-helper.sh "$package_dir/"

            if [[ "$arch" == darwin-* ]]; then
              extract_dir=$(mktemp -d)
              tar -xzf "$archive_file" -C "$extract_dir"
              test -f "$extract_dir/cloudflared"
              mv "$extract_dir/cloudflared" "$package_dir/$package_binary"
              rm -rf "$extract_dir"
              rm -f "$archive_file"
            else
              mv "$archive_file" "$package_dir/$package_binary"
            fi

            chmod +x "$package_dir/cf-helper.sh" "$package_dir/$package_binary"

            tar -C "$package_dir" -czf "release_assets/cf-helper-${package_suffix}.tar.gz" .
            echo "Package for ${package_suffix} created successfully."
          done

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "nightly-${{ github.run_number }}" release_assets/*.tar.gz \
            --title "Nightly No.${{ github.run_number }}" \
            --notes-file - << 'EOF'
          自动构建的发行版 No.${{ github.run_number }}

          此版本包含适用于 Linux 和 macOS 不同 CPU 架构的 `cloudflared` 二进制文件和 `cf-helper.sh` 脚本。
          下载后直接解压即可使用 (`cf-helper.sh` 已包含可执行权限)。

          **包含的附件:**
          - `cf-helper-amd64.tar.gz`: Linux x86_64 (Intel/AMD)
          - `cf-helper-arm64.tar.gz`: Linux 64 位 ARM
          - `cf-helper-arm.tar.gz`: Linux 32 位 ARM
          - `cf-helper-darwin-amd64.tar.gz`: macOS Intel
          - `cf-helper-darwin-arm64.tar.gz`: macOS Apple Silicon
          EOF
